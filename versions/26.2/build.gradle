plugins { id 'net.fabricmc.fabric-loom' version '1.18.4' }
version = project.mod_version
group = 'dev.fluxtweaks'
base { archivesName = 'fluxtweaks-mc26.2' }
repositories { mavenCentral(); maven { url = 'https://api.modrinth.com/maven' } }
loom { splitEnvironmentSourceSets(); mods { fluxtweaks { sourceSet sourceSets.main; sourceSet sourceSets.client } } }
sourceSets {
    main.java.srcDirs = ['../../src/main/java']
    main.resources.srcDirs = ['src/main/resources', '../../src/main/resources']
    test.java.srcDirs = ['../../src/test/java']
}
processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version.toString()
    filesMatching('fabric.mod.json') { expand version: project.version.toString() }
    from('../../build/native/fluxmedia.dll') { into 'assets/fluxtweaks/native/windows-x64' }
}
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.2'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
test { useJUnitPlatform() }
jar { from('../../docs/licenses') { into 'META-INF/licenses' } }

tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '1000'] }

fabricApi {
  configureTests {
    createSourceSet = true; modId = 'fluxtweaks-test'
    enableGameTests = false; enableClientGameTests = true; eula = false
  }
}
tasks.register('gametestJar', Jar) { from sourceSets.gametest.output; archiveClassifier = 'gametest' }
tasks.register('runProductionClientGameTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
  mods.from tasks.named('gametestJar')
  jvmArgs.add('-Dfabric.client.gametest')
  programArgs.addAll('--username','Player0','--accessToken','0')
  runDir = layout.buildDirectory.dir(providers.gradleProperty('irisAcceptance').isPresent() ? 'run/productionIris' : providers.gradleProperty('sodiumAcceptance').isPresent() ? 'run/productionSodium' : 'run/productionFabric')
  useXVFB = false
}

tasks.named('sourcesJar') { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }
dependencies { productionRuntimeMods 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.2' }
tasks.register('buildNative', Exec) {
  inputs.files('../../native/media.cpp','../../native/build.ps1')
  outputs.file('../../build/native/fluxmedia.dll')
  commandLine 'powershell.exe','-NoProfile','-ExecutionPolicy','Bypass','-File',file('../../native/build.ps1').absolutePath,'-JavaHome',System.getProperty('java.home')
}
processResources { dependsOn tasks.named('buildNative') }

dependencies {
  if (providers.gradleProperty('sodiumAcceptance').isPresent() || providers.gradleProperty('irisAcceptance').isPresent())
    productionRuntimeMods 'maven.modrinth:sodium:mc26.2-0.9.2-fabric'
  if (providers.gradleProperty('irisAcceptance').isPresent())
    productionRuntimeMods 'maven.modrinth:iris:gxZWWnKH' // Iris 1.11.4+26.2-fabric, as bundled by Lunar
}
